[project]
name = "rum"
version = "0.1.0"
description = "International Repertoire Usage Monitor - evidence collector for foreign usage of CMO repertoire"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rum = "rum.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
